[package]
name = "yatt-desktop"
version = "0.1.0"
description = "YATT desktop shell (libcosmic)"
edition = "2021"

[dependencies]
# wgpu: el renderer default (tiny-skia/softbuffer) paniquea con visuals X11 de 32 bits.
libcosmic = { git = "https://github.com/pop-os/libcosmic", features = ["wgpu"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
futures-timer = "3"
# Decode PNG de screenshots: iced viene image-without-codecs desde libcosmic.
image = { version = "0.25", default-features = false, features = ["png"] }
# Fechas de reportes (started_at/finished_at) y slugs.
time = { version = "0.3", features = ["local-offset"] }
